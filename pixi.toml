[workspace]
authors = ["corednoir <252454232+corednoir@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "UVR5-UI"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
app = "python app.py --open"

[dependencies]
python = "==3.10.12"

